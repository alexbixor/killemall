name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: toolchain (pasmo 0.5.3, Python venv with Pillow + numpy)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pasmo
          # the 48K/128K build scripts cd into ~/work/killemall: point that path at the checkout
          mkdir -p "$HOME/work" && ln -sfn "$GITHUB_WORKSPACE" "$HOME/work/killemall"
          cd "$HOME/work/killemall"
          python3 -m venv .venv
          .venv/bin/pip install -q pillow numpy

      - name: build all three editions
        run: |
          cd "$HOME/work/killemall"
          bash tools/ci_build.sh

      - name: artefacts must be byte-identical to the gated hashes
        run: |
          cd "$HOME/work/killemall"
          bash tools/ci_check.sh

      - uses: actions/upload-artifact@v4
        with:
          name: killemall-${{ github.sha }}
          path: |
            build/killemall48_m25.tap
            build/killemall128_m2.tap
            build/next/killemall_b.nex
            build/ci_sha256.txt
